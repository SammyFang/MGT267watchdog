name: Sim-Day Notification Monitor

on:
  schedule:
    - cron: "9 */4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: supply-chain-warning
  cancel-in-progress: false

jobs:
  warning-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore warning state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: warning-state-${{ github.run_id }}
          restore-keys: |
            warning-state-
            monitor-state-

      - name: Check sim-day notifications
        run: |
          set -euo pipefail

          cycles="${WARNING_MONITOR_CYCLES:-12}"
          interval="${WARNING_MONITOR_INTERVAL_SECONDS:-300}"
          consecutive_failures=0
          echo "Starting sim-day notification loop: ${cycles} cycle(s), ${interval}s interval."

          for cycle in $(seq 1 "${cycles}"); do
            echo "::group::Sim-day monitor cycle ${cycle}/${cycles}"
            if npm run warning-email; then
              consecutive_failures=0
            else
              rc="$?"
              consecutive_failures=$((consecutive_failures + 1))
              echo "::warning::Sim-day monitor cycle ${cycle} failed with exit code ${rc}; the loop will retry after the normal interval."
            fi
            echo "::endgroup::"

            if [ "${cycle}" -lt "${cycles}" ]; then
              sleep "${interval}"
            fi
          done

          echo "Sim-day notification loop completed. Consecutive failed cycles at end: ${consecutive_failures}."
        env:
          SC_TEAM_ID: ${{ secrets.SC_TEAM_ID }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SC_INSTITUTION: ${{ secrets.SC_INSTITUTION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ISSUE_NOTIFICATIONS: "true"
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL || '' }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_ENABLED: ${{ vars.WECOM_ENABLED || 'false' }}
          WECOM_NOTIFY_MODE: ${{ vars.WECOM_NOTIFY_MODE || 'alerts_or_day_change' }}
          WARNING_MONITOR_CYCLES: ${{ vars.WARNING_MONITOR_CYCLES || '12' }}
          WARNING_MONITOR_INTERVAL_SECONDS: ${{ vars.WARNING_MONITOR_INTERVAL_SECONDS || '300' }}
          EMAIL_EVENT_MIN_INTERVAL_MINUTES: ${{ vars.EMAIL_EVENT_MIN_INTERVAL_MINUTES || '55' }}

      - name: Save warning state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: warning-state-${{ github.run_id }}

      - name: Upload warning output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warning-output
          path: .monitor-state
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Ensure GitHub Pages is configured
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")
          if [ "${status}" = "404" ]; then
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pages" \
              -d '{"build_type":"workflow"}'
          else
            cat /tmp/pages.json
          fi

      - name: Configure GitHub Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload status page
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .monitor-state/status-site

      - name: Deploy status page
        id: deployment
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Queue next sim-day notification run
        if: ${{ always() && !cancelled() && (vars.WARNING_SELF_DISPATCH || 'true') != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/warning.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Queued next sim-day notification run."
