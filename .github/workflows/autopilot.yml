name: Guarded Policy Autopilot
run-name: Guarded Policy Autopilot Disabled

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supply-chain-policy-autopilot
  cancel-in-progress: true

jobs:
  autopilot-disabled:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[autopilot-stop]')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Autopilot disabled
        run: |
          echo "Guarded Policy Autopilot is disabled."
          echo "No crawl, dry-run, game form submit, or self-dispatch will run."
