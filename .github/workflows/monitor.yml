name: Supply Chain Watchdog

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: supply-chain-hourly
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hourly-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Run watchdog
        run: npm run monitor
        env:
          SC_TEAM_ID: ${{ secrets.SC_TEAM_ID }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SC_INSTITUTION: ${{ secrets.SC_INSTITUTION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_EMAIL_REPORT: ${{ github.event_name != 'schedule' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ISSUE_NOTIFICATIONS: "true"
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL || '' }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_ENABLED: ${{ vars.WECOM_ENABLED || 'false' }}
          WECOM_NOTIFY_MODE: ${{ vars.WECOM_NOTIFY_MODE || 'alerts' }}

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}

      - name: Upload monitor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output
          path: .monitor-state
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Ensure GitHub Pages is configured
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")
          if [ "${status}" = "404" ]; then
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pages" \
              -d '{"build_type":"workflow"}'
          else
            cat /tmp/pages.json
          fi

      - name: Configure GitHub Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload status page
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .monitor-state/status-site

      - name: Deploy status page
        id: deployment
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
