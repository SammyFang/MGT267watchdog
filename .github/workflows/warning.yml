name: 15-Minute Warning Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: supply-chain-warning
  cancel-in-progress: true

jobs:
  warning-monitor:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[warning-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dynamic warning rules
        run: npm run warning-email
        env:
          SC_TEAM_ID: ${{ secrets.SC_TEAM_ID }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SC_INSTITUTION: ${{ secrets.SC_INSTITUTION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ISSUE_NOTIFICATIONS: "true"
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL || 'https://sammyfang.github.io/MGT267watchdog/' }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_ENABLED: ${{ vars.WECOM_ENABLED || 'false' }}
          WECOM_NOTIFY_MODE: ${{ vars.WECOM_NOTIFY_MODE || 'alerts' }}

      - name: Upload warning output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warning-output
          path: .monitor-state
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload status page
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .monitor-state/status-site

      - name: Deploy status page
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
