name: Guarded Policy Autopilot
run-name: Guarded Policy Autopilot

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[autopilot-now]') && format('supply-chain-policy-autopilot-skip-{0}', github.run_id) || 'supply-chain-policy-autopilot' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[autopilot-now]') }}

jobs:
  autopilot:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[autopilot-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore autopilot state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: autopilot-state-${{ github.run_id }}
          restore-keys: |
            autopilot-state-
            warning-state-
            monitor-state-

      - name: Run guarded autopilot loop
        run: |
          set -euo pipefail

          cycles="${AUTOPILOT_CYCLES:-24}"
          interval="${AUTOPILOT_INTERVAL_SECONDS:-300}"
          consecutive_failures=0
          echo "Starting guarded autopilot loop: ${cycles} cycle(s), ${interval}s interval."

          for cycle in $(seq 1 "${cycles}"); do
            echo "::group::Autopilot cycle ${cycle}/${cycles}"
            if npm run apply-policy; then
              consecutive_failures=0
            else
              rc="$?"
              consecutive_failures=$((consecutive_failures + 1))
              echo "::warning::Autopilot cycle ${cycle} failed with exit code ${rc}; the loop will retry after the normal interval."
            fi
            echo "::endgroup::"

            if [ "${cycle}" -lt "${cycles}" ]; then
              sleep "${interval}"
            fi
          done

          echo "Autopilot loop completed. Consecutive failed cycles at end: ${consecutive_failures}."
        env:
          SC_TEAM_ID: ${{ secrets.SC_TEAM_ID }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SC_INSTITUTION: ${{ secrets.SC_INSTITUTION }}
          POLICY_APPLY_AUTOPILOT: "true"
          POLICY_AUTOPILOT_ENABLED: ${{ vars.POLICY_AUTOPILOT_ENABLED || 'true' }}
          POLICY_APPLY_CONFIRM: "APPLY"
          POLICY_APPLY_MODE: "recommended"
          POLICY_APPLY_DRY_RUN: "false"
          POLICY_ALLOW_SHIPPING_METHOD_CHANGE: "false"
          AUTOPILOT_CYCLES: ${{ vars.AUTOPILOT_CYCLES || '24' }}
          AUTOPILOT_INTERVAL_SECONDS: ${{ vars.AUTOPILOT_INTERVAL_SECONDS || '300' }}

      - name: Save autopilot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: autopilot-state-${{ github.run_id }}

      - name: Upload autopilot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-output
          path: |
            .monitor-state/policy_apply_latest.json
            .monitor-state/policy_apply_latest.csv
            .monitor-state/adjustment_plan_latest.json
            .monitor-state/adjustment_plan_latest.csv
            .monitor-state/policy_snapshot_latest.csv
            .monitor-state/latest.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Queue next autopilot run
        if: ${{ always() && !cancelled() && (vars.POLICY_AUTOPILOT_SELF_DISPATCH || 'true') != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/autopilot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Queued next guarded autopilot run."
