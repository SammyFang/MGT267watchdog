name: Apply Recommended Policy
run-name: Apply Recommended Policy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Choose APPLY to submit accepted changes. DRY_RUN validates only."
        required: true
        type: choice
        options:
          - DRY_RUN
          - APPLY
        default: "DRY_RUN"
      apply_mode:
        description: "recommended uses latest safe values. custom applies optional custom_json overrides."
        required: true
        type: choice
        options:
          - recommended
          - custom
        default: recommended
      dry_run:
        description: "Force validation only without submitting game forms."
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      custom_json:
        description: "Optional JSON overrides, e.g. {\"factory_sorange\":{\"order_point\":950}}"
        required: false
        default: "{}"
      allow_shipping_method_change:
        description: "Extra confirmation for shipping method changes; config must also allow it."
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  group: supply-chain-policy-apply
  cancel-in-progress: false

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and apply approved policy changes
        run: npm run apply-policy
        env:
          SC_TEAM_ID: ${{ secrets.SC_TEAM_ID }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SC_INSTITUTION: ${{ secrets.SC_INSTITUTION }}
          POLICY_APPLY_CONFIRM: ${{ inputs.confirm }}
          POLICY_APPLY_MODE: ${{ inputs.apply_mode }}
          POLICY_APPLY_DRY_RUN: ${{ inputs.dry_run }}
          POLICY_CUSTOM_JSON: ${{ inputs.custom_json }}
          POLICY_ALLOW_SHIPPING_METHOD_CHANGE: ${{ inputs.allow_shipping_method_change }}

      - name: Upload apply output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-apply-output
          path: |
            .monitor-state/policy_apply_latest.json
            .monitor-state/policy_apply_latest.csv
            .monitor-state/adjustment_plan_latest.json
            .monitor-state/adjustment_plan_latest.csv
            .monitor-state/policy_snapshot_latest.csv
          if-no-files-found: ignore
          include-hidden-files: true
